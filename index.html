<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>suggesto-landing</title>
  <style>
    body {
      background-color: #0b0f19;
      color: white;
      margin: 0;
    }

    #error-display {
      color: red;
      padding: 20px;
      background: white;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10000;
      display: none;
    }
  </style>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      var display = document.getElementById('error-display');
      if (display) {
        display.style.display = 'block';
        display.innerHTML += '<h3>Global Error:</h3><pre>' + message + '\n' + source + ':' + lineno + '</pre>';
      }
    };
    window.addEventListener('unhandledrejection', function (event) {
      var display = document.getElementById('error-display');
      if (display) {
        display.style.display = 'block';
        display.innerHTML += '<h3>Unhandled Rejection:</h3><pre>' + event.reason + '</pre>';
      }
    });
    console.log("Inline script running");
    window.onload = function () {
      var root = document.getElementById('root');
      if (root) {
        var testDiv = document.createElement('div');
        testDiv.style.color = 'green';
        testDiv.innerHTML = 'JS Inline OK';
        root.appendChild(testDiv);
      }
    }
  </script>
</head>

<body>
  <div id="error-display"></div>
  <div id="root">
    <div style="color: white; font-family: sans-serif; text-align: center; padding-top: 50px;">
      Chargement de l'application...
    </div>
  </div>

  <!-- Voiceflow Chatbot -->
  <script type="text/javascript">
      (function (d, t) {
        var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
        v.onload = function () {
          window.voiceflow.chat.load({
            verify: { projectID: '68ed1ebc12fe53eee0c0c9a4' },
            url: 'https://general-runtime.voiceflow.com',
            versionID: 'production'
          }).then(function () {
            // Attendre 5 secondes puis ouvrir le chat automatiquement
            setTimeout(function () {
              if (window.voiceflow && window.voiceflow.chat) {
                window.voiceflow.chat.open();
              }
            }, 5000);
          });
        };
        v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
        v.type = "text/javascript";
        s.parentNode.insertBefore(v, s);
      })(document, 'script');
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
